# Coverage workflow — runs backend and frontend unit tests with coverage,
# updates reports/coverage.md, commits it back on pushes to master,
# and sends a Teams notification with the summary.
#
# Requirements:
#   - TEAMS_WEBHOOK_URL secret — Teams incoming webhook URL (same as pr-notify.yml)
#
# Triggers:
#   - Push to master
#   - Pull requests targeting master
#   - Manual dispatch (workflow_dispatch)

name: Coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write  # needed to commit reports/coverage.md back on push to master

env:
  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Fetch the full history so the commit-back step can push cleanly
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies (lockfile-enforced, scripts suppressed)
        run: npm ci --ignore-scripts --engine-strict

      - name: Rebuild allowlisted lifecycle packages
        # Restores native module bindings (e.g., better-sqlite3) that
        # --ignore-scripts suppressed. Required for backend unit tests.
        run: |
          python3 -c "
          import yaml, subprocess
          with open('.github/supply-chain/lifecycle-allowlist.yml') as f:
              data = yaml.safe_load(f)
          for entry in data.get('allowed', []):
              if 'ci' in entry.get('environments', []):
                  print(f'Rebuilding {entry[\"package\"]}...')
                  subprocess.run(['npm', 'rebuild', entry['package']], check=True)
          "

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        # Required by the real-server E2E suite, which serves the built dist/
        # through the backend. Also used as the base before the coverage build.
        run: npm run build --workspace=frontend

      - name: Run backend coverage
        run: npm run test:coverage --workspace=backend

      - name: Run frontend coverage
        run: npm run test:coverage --workspace=frontend

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run E2E mock coverage
        # Rebuilds the frontend with Istanbul instrumentation (VITE_COVERAGE=true),
        # runs the mock Playwright suite, then merges per-test coverage files.
        # Output: frontend/coverage-e2e/coverage-summary.json
        run: npm run test:coverage:e2e

      - name: Run E2E real-server coverage
        # Runs the real-server Playwright suite with NODE_V8_COVERAGE so the
        # backend process dumps V8 coverage on exit, then generates the c8 report.
        # Output: backend/coverage-e2e/coverage-summary.json
        run: npm run test:coverage:e2e:real

      - name: Generate coverage report
        run: node scripts/generate-coverage-report.mjs

      - name: Commit updated coverage report
        # Only commit on pushes to master. On PRs, the report is generated but not
        # persisted — the Teams notification still fires with the latest numbers.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/coverage.md
          git diff --staged --quiet || git commit -m "chore: update coverage report [skip ci]"
          git push

      - name: Notify Teams
        if: env.TEAMS_WEBHOOK_URL != ''
        env:
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_ACTOR:      ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_NAME:        ${{ github.event_name }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_TITLE:          ${{ github.event.pull_request.title }}
          PR_URL:            ${{ github.event.pull_request.html_url }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          def read_json(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return None

          def pct(val):
              return f"{val:.1f}%" if isinstance(val, (int, float)) else "N/A"

          def badge(val):
              if not isinstance(val, (int, float)):
                  return "⬜"
              if val >= 80:
                  return "🟢"
              if val >= 60:
                  return "🟡"
              return "🔴"

          def parse_suite(name, summary_path, results_path, results_format):
              cov = read_json(summary_path)
              res = read_json(results_path)
              t   = (cov or {}).get("total", {})
              lines_pct = t.get("lines", {}).get("pct")

              if res and results_format == "vitest":
                  passed = res.get("numPassedTests", 0)
                  total  = res.get("numTotalTests",  0)
                  failed = res.get("numFailedTests", 0)
              elif res and results_format == "playwright":
                  s      = res.get("stats", {})
                  passed = s.get("expected", 0)
                  failed = s.get("unexpected", 0)
                  total  = passed + failed
              else:
                  passed = failed = total = None

              tests = f"{'🔴' if failed else '🟢'} {passed}/{total}" if total is not None else "N/A"
              return {
                  "name":     name,
                  "tests":    tests,
                  "lines":    f"{badge(lines_pct)} {pct(lines_pct)}" if cov else "N/A",
                  "stmts":    pct(t.get("statements", {}).get("pct")),
                  "branches": pct(t.get("branches",   {}).get("pct")),
                  "funcs":    pct(t.get("functions",  {}).get("pct")),
              }

          suite_data = [
              parse_suite("Backend unit",  "backend/coverage/coverage-summary.json",  "backend/coverage/test-results.json",       "vitest"),
              parse_suite("Frontend unit", "frontend/coverage/coverage-summary.json", "frontend/coverage/test-results.json",      "vitest"),
              parse_suite("E2E mock",      "frontend/coverage-e2e/coverage-summary.json", "frontend/coverage-e2e/test-results.json", "playwright"),
              parse_suite("E2E real",      "backend/coverage-e2e/coverage-summary.json",  "backend/coverage-e2e/test-results.json",  "playwright"),
          ]

          def cell(text, weight="Default", width="auto"):
              return {
                  "type": "Column", "width": width,
                  "items": [{"type": "TextBlock", "text": str(text),
                             "weight": weight, "wrap": False, "size": "Small"}],
              }

          COLS = ["Suite", "Tests", "Lines", "Stmts", "Branches", "Funcs"]
          KEYS = ["name", "tests", "lines", "stmts", "branches", "funcs"]

          header_row = {
              "type": "ColumnSet", "separator": True,
              "columns": [cell(h, "Bolder", "stretch" if i == 0 else "auto") for i, h in enumerate(COLS)],
          }
          data_rows = [
              {
                  "type": "ColumnSet",
                  "columns": [cell(s[k], width="stretch" if i == 0 else "auto") for i, k in enumerate(KEYS)],
              }
              for s in suite_data
          ]

          event      = os.environ["EVENT_NAME"]
          ref        = os.environ["GITHUB_REF_NAME"]
          sha        = os.environ["GITHUB_SHA"][:7]
          actor      = os.environ["GITHUB_ACTOR"]
          repo       = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          pr_number  = os.environ.get("PR_NUMBER", "")
          pr_title   = os.environ.get("PR_TITLE", "")
          pr_url     = os.environ.get("PR_URL", "")

          if event == "pull_request" and pr_number:
              context_line = f"PR #{pr_number}: {pr_title}"
              run_url = pr_url
          else:
              context_line = f"Branch: {ref} @ {sha}"
              run_url = f"{server_url}/{repo}/commit/{os.environ['GITHUB_SHA']}"

          card = {
              "type":    "AdaptiveCard",
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "version": "1.4",
              "body": [
                  {"type": "TextBlock", "size": "Medium", "weight": "Bolder",
                   "text": f"Coverage Report \u2014 {repo}", "wrap": True},
                  {"type": "TextBlock", "text": context_line, "wrap": True, "isSubtle": True},
                  header_row,
                  *data_rows,
                  {"type": "TextBlock", "text": f"Triggered by: {actor}",
                   "wrap": True, "isSubtle": True, "size": "Small"},
              ],
              "actions": [{"type": "Action.OpenUrl", "title": "View Run", "url": run_url}],
          }

          req = urllib.request.Request(
              os.environ["TEAMS_WEBHOOK_URL"],
              data=json.dumps(card).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req)
              print("Teams notified with coverage table.")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Teams webhook HTTP {e.code}: {e.reason} - {body}")
              raise
          EOF

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_ACTOR:      ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_NAME:        ${{ github.event_name }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_TITLE:          ${{ github.event.pull_request.title }}
          PR_URL:            ${{ github.event.pull_request.html_url }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          def read_json(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return None

          def pct(val):
              return f"{val:.1f}%" if isinstance(val, (int, float)) else "N/A"

          def badge(val):
              if not isinstance(val, (int, float)):
                  return "-"
              if val >= 80:
                  return "OK"
              if val >= 60:
                  return "~"
              return "!!"

          def parse_suite(name, summary_path, results_path, results_format):
              cov = read_json(summary_path)
              res = read_json(results_path)
              t   = (cov or {}).get("total", {})
              lines_pct = t.get("lines", {}).get("pct")

              if res and results_format == "vitest":
                  passed = res.get("numPassedTests", 0)
                  total  = res.get("numTotalTests",  0)
                  failed = res.get("numFailedTests", 0)
              elif res and results_format == "playwright":
                  s      = res.get("stats", {})
                  passed = s.get("expected", 0)
                  failed = s.get("unexpected", 0)
                  total  = passed + failed
              else:
                  passed = failed = total = None

              status = "PASS" if (total is not None and failed == 0) else ("FAIL" if failed else "N/A")
              tests  = f"{passed}/{total}" if total is not None else "N/A"
              return {
                  "name":     name,
                  "status":   status,
                  "tests":    tests,
                  "lines":    f"{badge(lines_pct)} {pct(lines_pct)}" if cov else "N/A",
                  "stmts":    pct(t.get("statements", {}).get("pct")),
                  "branches": pct(t.get("branches",   {}).get("pct")),
                  "funcs":    pct(t.get("functions",  {}).get("pct")),
              }

          suite_data = [
              parse_suite("Backend unit",  "backend/coverage/coverage-summary.json",  "backend/coverage/test-results.json",       "vitest"),
              parse_suite("Frontend unit", "frontend/coverage/coverage-summary.json", "frontend/coverage/test-results.json",      "vitest"),
              parse_suite("E2E mock",      "frontend/coverage-e2e/coverage-summary.json", "frontend/coverage-e2e/test-results.json", "playwright"),
              parse_suite("E2E real",      "backend/coverage-e2e/coverage-summary.json",  "backend/coverage-e2e/test-results.json",  "playwright"),
          ]

          # Build monospace table for Slack code block
          C = [14, 6, 8, 9, 8, 8, 8]  # column widths
          def row(vals):
              return " ".join(str(v).ljust(C[i]) for i, v in enumerate(vals))

          header = row(["Suite", "Status", "Tests", "Lines", "Stmts", "Branches", "Funcs"])
          sep    = "-" * len(header)
          lines  = [header, sep]
          for s in suite_data:
              lines.append(row([s["name"], s["status"], s["tests"],
                                s["lines"], s["stmts"], s["branches"], s["funcs"]]))
          table = "```\n" + "\n".join(lines) + "\n```"

          event      = os.environ["EVENT_NAME"]
          ref        = os.environ["GITHUB_REF_NAME"]
          sha        = os.environ["GITHUB_SHA"][:7]
          actor      = os.environ["GITHUB_ACTOR"]
          repo       = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          pr_number  = os.environ.get("PR_NUMBER", "")
          pr_title   = os.environ.get("PR_TITLE", "")
          pr_url     = os.environ.get("PR_URL", "")

          if event == "pull_request" and pr_number:
              context_line = f"PR #{pr_number}: {pr_title}"
              run_url = pr_url
          else:
              context_line = f"Branch: `{ref}` @ `{sha}`"
              run_url = f"{server_url}/{repo}/commit/{os.environ['GITHUB_SHA']}"

          blocks = [
              {"type": "header", "text": {"type": "plain_text", "text": f"Coverage Report - {repo}"}},
              {"type": "context", "elements": [
                  {"type": "mrkdwn", "text": f"{context_line}  |  Triggered by: {actor}"}
              ]},
              {"type": "section", "text": {"type": "mrkdwn", "text": table}},
              {"type": "actions", "elements": [
                  {"type": "button", "text": {"type": "plain_text", "text": "View Run"}, "url": run_url}
              ]},
          ]

          payload = {"blocks": blocks}
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req)
              print("Slack notified with coverage table.")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Slack webhook HTTP {e.code}: {e.reason} - {body}")
              raise
          EOF
